spring.application.name=student-placement-management

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placement_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${APP_JWT_SECRET}

server.port=8080
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Optional first-admin bootstrap. Used only if the database has no ADMIN account.
app.bootstrap-admin.email=${INITIAL_ADMIN_EMAIL:}
app.bootstrap-admin.password=${INITIAL_ADMIN_PASSWORD:}
